name: Build and Push to Alibaba Cloud ACR

on:
  push:
    branches:
      - main  # ⚡ Runs automatically every time you push code to the 'main' branch
  workflow_dispatch: #ADD THIS LINE (allows manual triggering)

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out your code inside the GitHub runner
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up Docker Buildx (highly recommended tool for efficient building)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Log into Alibaba Cloud Container Registry
    - name: Log in to Alibaba Cloud ACR
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_REGISTRY }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # 4. Build the image and push it to ACR
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        provenance: false
        annotations: false
        # ⚠️ Replace 'your-namespace' and 'your-repo' with your actual ACR values
        tags: |
          ${{ secrets.ACR_REGISTRY }}/imhkcortexcloud/demo:latest
          ${{ secrets.ACR_REGISTRY }}/imhkcortexcloud/demo:${{ github.sha }}
